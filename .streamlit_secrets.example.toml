# Paste into Streamlit Cloud -> App settings -> Secrets. Never commit real values.
JWT_SECRET = "generate-40+-random-chars"
SEED_PASSWORD = "demo-password-for-fictional-users"
# Optional but recommended: a free hosted Postgres (e.g. Neon) so data survives restarts.
# Without it the app uses a throwaway SQLite file that resets whenever the app restarts.
DATABASE_URL = "postgresql+psycopg2://USER:PASSWORD@HOST/DBNAME?sslmode=require"
