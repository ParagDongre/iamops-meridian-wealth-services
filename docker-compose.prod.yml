# Production-style stack. Only Caddy (80/443) is published. Needs a real domain with DNS pointing here.
x-app: &app
  build: .
  env_file: .env
  restart: unless-stopped
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment: {POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB}", KEYCLOAK_DB_PASSWORD: "${KEYCLOAK_DB_PASSWORD}"}
    volumes: [pgdata:/var/lib/postgresql/data, ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"], interval: 5s, retries: 20}
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: start
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KC_DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on: {postgres: {condition: service_healthy}}
  openldap:
    image: osixia/openldap:1.5.0
    restart: unless-stopped
    environment: {LDAP_ORGANISATION: "Meridian Wealth Services", LDAP_DOMAIN: "${LDAP_DOMAIN}", LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD}"}
    volumes: [ldapdata:/var/lib/ldap, ldapconf:/etc/ldap/slapd.d]
  api:
    <<: *app
    command: sh -c "python -m backend.app.migrate && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips='*'"
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/ready')"], interval: 10s, retries: 10}
  ui:
    <<: *app
    command: streamlit run frontend/app.py --server.address=0.0.0.0 --server.port=8501 --server.headless=true --server.enableXsrfProtection=true --browser.gatherUsageStats=false
    environment: {API_URL: "http://api:8000"}
    depends_on: {api: {condition: service_healthy}}
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: {APP_DOMAIN: "${APP_DOMAIN}", KC_DOMAIN: "${KC_DOMAIN}"}
    volumes: [./docker/Caddyfile:/etc/caddy/Caddyfile:ro, caddydata:/data]
    depends_on: [ui, keycloak]
volumes: {pgdata: {}, ldapdata: {}, ldapconf: {}, caddydata: {}}
