services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - iamops

  iamops:
    build: .
    restart: unless-stopped
    environment:
      ENV: prod
      NODE_ENV: production
      PORT: "3000"
      APP_URL: ${APP_URL:-https://iamops.meridianwealth.internal}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set >= 32 chars}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY must be set >= 32 chars}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD must be set}
      DATABASE_PATH: /app/data/iamops.db
      SLA_SWEEP_MINUTES: ${SLA_SWEEP_MINUTES:-5}
      DISABLE_API_DOCS: "true"
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: meridian
      KEYCLOAK_CLIENT_ID: iamops-console
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      LDAP_URL: ldap://openldap:389
      LDAP_BASE_DN: dc=meridian,dc=internal
    volumes:
      - iamops_data:/app/data
    depends_on:
      - keycloak
      - openldap

  postgres_kc:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD must be set}
    volumes:
      - kc_pg_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: start --optimized --http-enabled=true --hostname-strict=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres_kc:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      - postgres_kc

  openldap:
    image: osixia/openldap:1.5.0
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "Meridian Wealth Services"
      LDAP_DOMAIN: "meridian.internal"
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?LDAP_ADMIN_PASSWORD must be set}
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d

volumes:
  caddy_data:
  caddy_config:
  iamops_data:
  kc_pg_data:
  ldap_data:
  ldap_config:
